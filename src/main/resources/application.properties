# Configuração versionada (exemplo). NÃO coloque senhas nem chaves aqui: os valores sensíveis vêm de variáveis de
# ambiente, do .env local ou do application-dev.properties local, ambos fora do git (ver docs/guias/Como executar.md).
spring.application.name=tenant-rag-pgvector

# .env da pasta de execução (modelo em .env.example), lido como properties; variáveis de ambiente têm prioridade
spring.config.import=optional:file:.env[.properties]

# Banco. Usuário e senha não têm valor padrão: defina DB_USER e DB_PASSWORD no .env ou no ambiente
# (ou rode com o perfil dev, usando o application-dev.properties local).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragdb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA: o esquema é criado pelo Flyway; o Hibernate só confere (ADR-003)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway (migrations em src/main/resources/db/migration)
spring.flyway.enabled=true

# Erros em ProblemDetail (ADR-010)
spring.mvc.problemdetails.enabled=true

# Documentação da API (ADR-013)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

# OpenAI (ADR-006). Sem valor padrão: a chave vem só da variável de ambiente.
app.openai.api-key=${OPENAI_API_KEY}
app.openai.embedding-model=text-embedding-3-small
# Modelo de chat da resposta (ADR-006): temperatura baixa para respostas presas aos trechos
app.openai.chat-model=gpt-4o-mini
app.openai.temperature=0.1

# Upload de documentos (revisto em 2026-10-05): acima de 5 MB responde 413
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# O Tomcat lê (descarta) o resto do corpo recusado até este tamanho antes de responder; com o padrão de 2 MB ele
# fecha a conexão e o cliente não recebe o 413. Acima do max-request-size.
server.tomcat.max-swallow-size=10MB

# RAG: igual à coluna document_chunk.embedding da V1
app.rag.embedding-dimension=768
# Chunking em caracteres (ADR-007)
app.rag.chunk-size=1000
app.rag.chunk-overlap=200
# Busca: topK padrão e máximo
app.rag.default-top-k=5
# Resposta: topK padrão do /ask, maior para perguntas que cruzam documentos
app.rag.answer-top-k=8
app.rag.max-top-k=20

# Segurança (ADR-008). Sem valor padrão: a aplicação não sobe sem ADMIN_API_KEY.
app.security.admin-api-key=${ADMIN_API_KEY}
# Autenticação só por chave de API: sem o usuário em memória com senha gerada do Spring Boot
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
